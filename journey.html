<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Cosmic Dream Bog - Journey</title>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #08090b;
      overflow: hidden;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .journey-page {
      position: relative;
      width: min(100vw, calc(100vh * 724 / 1086));
      height: min(100vh, calc(100vw * 1086 / 724));
    }

    .journey-image {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
    }

    /* Invisible clickable area over BOG VOYAGER */
    .bog-voyager-button {
      position: absolute;
      top: 2.2%;
      right: 2.5%;
      width: 20%;
      height: 6%;
      border: 0;
      background: transparent;
      cursor: pointer;
      z-index: 20;
    }

    /* Covers the status light shown in the artwork */
    .wallet-status-dot {
      position: absolute;
      top: 4%;
      right: 17%;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 8px #22c55e;
      z-index: 25;
      pointer-events: none;
    }

    .wallet-status-dot.disconnected {
      background: #ef4444;
      box-shadow: 0 0 8px #ef4444;
    }
  </style>
</head>

<body>

  <main class="journey-page">

    <img
      src="cdb-journey.png?v=8"
      alt="Cosmic Dream Bog Journey"
      class="journey-image"
    >

    <div
      id="walletStatusDot"
      class="wallet-status-dot">
    </div>

    <button
      class="bog-voyager-button"
      aria-label="Bog Voyager"
      title="Bog Voyager"
      onclick="toggleBogVoyager()">
    </button>

  </main>

  <script>
    const statusDot = document.getElementById("walletStatusDot");

    function showConnected() {
      statusDot.classList.remove("disconnected");
    }

    function showDisconnected() {
      statusDot.classList.add("disconnected");
    }

    async function checkWalletStatus() {
      if (!window.ethereum) {
        showDisconnected();
        return;
      }

      try {
        const accounts = await window.ethereum.request({
          method: "eth_accounts"
        });

        if (accounts.length > 0) {
          showConnected();
          sessionStorage.setItem("cosmicDreamWallet", accounts[0]);
        } else {
          showDisconnected();
          sessionStorage.removeItem("cosmicDreamWallet");
        }
      } catch (error) {
        console.error(error);
        showDisconnected();
      }
    }

    async function disconnectWallet() {
      sessionStorage.removeItem("cosmicDreamWallet");

      if (window.ethereum) {
        try {
          await window.ethereum.request({
            method: "wallet_revokePermissions",
            params: [
              {
                eth_accounts: {}
              }
            ]
          });
        } catch (error) {
          console.log("Wallet permission revoke:", error);
        }
      }

      showDisconnected();
    }

    async function connectWallet() {
      if (!window.ethereum) {
        alert("No compatible wallet detected.");
        return;
      }

      try {
        const accounts = await window.ethereum.request({
          method: "eth_requestAccounts"
        });

        if (accounts.length > 0) {
          sessionStorage.setItem("cosmicDreamWallet", accounts[0]);
          showConnected();
        }
      } catch (error) {
        console.error(error);
      }
    }

    async function toggleBogVoyager() {
      if (!window.ethereum) {
        showDisconnected();
        return;
      }

      const accounts = await window.ethereum.request({
        method: "eth_accounts"
      });

      if (accounts.length > 0) {
        await disconnectWallet();
      } else {
        await connectWallet();
      }
    }

    if (window.ethereum) {
      window.ethereum.on("accountsChanged", function(accounts) {
        if (accounts.length > 0) {
          sessionStorage.setItem("cosmicDreamWallet", accounts[0]);
          showConnected();
        } else {
          sessionStorage.removeItem("cosmicDreamWallet");
          showDisconnected();
        }
      });
    }

    checkWalletStatus();
  </script>

</body>
</html>
