<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Cosmic Dream Bog - Journey</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #08090b;
      overflow: hidden;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .journey-page {
      position: relative;
      width: min(100vw, calc(100vh * 724 / 1086));
      height: min(100vh, calc(100vw * 1086 / 724));
    }

    .journey-image {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
    }

    /* Real button that completely covers the old BOG EXPLORER artwork */
    .bog-voyager {
      position: absolute;

      top: 1.2%;
      right: 1.8%;

      width: 29%;
      height: 5.8%;

      margin: 0;
      padding: 6px 10px;

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;

      border: 1px solid #7c3aed;
      border-radius: 6px;

      background: #0b0713;
      color: white;

      box-shadow:
        0 0 0 3px #08090b,
        0 0 10px rgba(124, 58, 237, 0.45);

      cursor: pointer;
      z-index: 100;
    }

    .voyager-text {
      flex: 1;
      min-width: 0;
      text-align: left;
    }

    .voyager-title {
      display: block;

      color: #c084fc;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.6px;
      line-height: 1;
    }

    .wallet-address {
      display: block;

      margin-top: 5px;

      color: #d1d5db;
      font-family: monospace;
      font-size: 8px;
      line-height: 1;

      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .status-dot {
      flex: 0 0 auto;

      width: 10px;
      height: 10px;

      border-radius: 50%;

      background: #ef4444;
      box-shadow: 0 0 8px #ef4444;
    }

    .status-dot.connected {
      background: #22c55e;
      box-shadow: 0 0 8px #22c55e;
    }
  </style>
</head>

<body>

  <main class="journey-page">

    <img
      src="cdb-journey.png?v=10"
      alt="Cosmic Dream Bog Journey"
      class="journey-image"
    >

    <button
      id="bogVoyager"
      class="bog-voyager"
      type="button"
      onclick="toggleWallet()"
      aria-label="Bog Voyager wallet connection"
    >

      <span class="voyager-text">

        <span class="voyager-title">
          BOG VOYAGER
        </span>

        <span
          id="walletAddress"
          class="wallet-address">
          DISCONNECTED
        </span>

      </span>

      <span
        id="statusDot"
        class="status-dot">
      </span>

    </button>

  </main>

  <script>

    const walletAddress =
      document.getElementById("walletAddress");

    const statusDot =
      document.getElementById("statusDot");

    function shortenAddress(address) {
      return (
        address.slice(0, 6) +
        "..." +
        address.slice(-4)
      );
    }

    function setConnected(address) {

      walletAddress.textContent =
        shortenAddress(address);

      statusDot.classList.add("connected");

      sessionStorage.setItem(
        "cosmicDreamWallet",
        address
      );
    }

    function setDisconnected() {

      walletAddress.textContent =
        "DISCONNECTED";

      statusDot.classList.remove("connected");

      sessionStorage.removeItem(
        "cosmicDreamWallet"
      );
    }

    async function checkWalletStatus() {

      if (!window.ethereum) {
        setDisconnected();
        return;
      }

      try {

        const accounts =
          await window.ethereum.request({
            method: "eth_accounts"
          });

        if (accounts.length > 0) {
          setConnected(accounts[0]);
        } else {
          setDisconnected();
        }

      } catch (error) {

        console.error(error);
        setDisconnected();

      }
    }

    async function connectWallet() {

      if (!window.ethereum) {
        alert("No compatible wallet detected.");
        return;
      }

      try {

        const accounts =
          await window.ethereum.request({
            method: "eth_requestAccounts"
          });

        if (accounts.length > 0) {
          setConnected(accounts[0]);
        }

      } catch (error) {

        console.error(error);

      }
    }

    async function disconnectWallet() {

      sessionStorage.removeItem(
        "cosmicDreamWallet"
      );

      if (window.ethereum) {

        try {

          await window.ethereum.request({
            method: "wallet_revokePermissions",
            params: [
              {
                eth_accounts: {}
              }
            ]
          });

        } catch (error) {

          console.log(
            "Wallet permission revoke:",
            error
          );

        }
      }

      setDisconnected();
    }

    async function toggleWallet() {

      if (!window.ethereum) {
        setDisconnected();
        return;
      }

      try {

        const accounts =
          await window.ethereum.request({
            method: "eth_accounts"
          });

        if (accounts.length > 0) {
          await disconnectWallet();
        } else {
          await connectWallet();
        }

      } catch (error) {

        console.error(error);
        setDisconnected();

      }
    }

    if (window.ethereum) {

      window.ethereum.on(
        "accountsChanged",
        function(accounts) {

          if (accounts.length > 0) {
            setConnected(accounts[0]);
          } else {
            setDisconnected();
          }

        }
      );
    }

    checkWalletStatus();

  </script>

</body>
</html>
