<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Cosmic Dream Bog - Journey</title>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #08090b;
      overflow: hidden;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .journey-page {
      position: relative;
      width: min(100vw, calc(100vh * 724 / 1086));
      height: min(100vh, calc(100vw * 1086 / 724));
    }

    .journey-image {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
    }

    .bog-voyager-proxy {
      position: absolute;
      top: 2.5%;
      right: 3%;
      width: 18%;
      height: 5%;
      border: none;
      background: transparent;
      cursor: pointer;
      z-index: 10;
    }

    .wallet-status-dot {
      position: absolute;
      top: 4.05%;
      right: 17%;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 8px #22c55e;
      z-index: 11;
      pointer-events: none;
    }

    .wallet-status-dot.disconnected {
      background: #ef4444;
      box-shadow: 0 0 8px #ef4444;
    }
  </style>
</head>

<body>

  <main class="journey-page">

    <img
      src="cdb-journey.png"
      alt="Cosmic Dream Bog Journey"
      class="journey-image"
    >

    <div
      id="walletStatusDot"
      class="wallet-status-dot">
    </div>

    <button
      class="bog-voyager-proxy"
      aria-label="Bog Voyager - Disconnect Wallet"
      title="Bog Voyager"
      onclick="disconnectWallet()">
    </button>

  </main>

  <script>

    const statusDot =
      document.getElementById("walletStatusDot");

    function showConnected() {
      statusDot.classList.remove("disconnected");
    }

    function showDisconnected() {
      statusDot.classList.add("disconnected");
    }

    async function checkWalletStatus() {

      if (!window.ethereum) {
        showDisconnected();
        return;
      }

      try {

        const accounts =
          await window.ethereum.request({
            method: "eth_accounts"
          });

        if (accounts.length > 0) {
          showConnected();
        } else {
          showDisconnected();
        }

      } catch (error) {
        console.log(error);
        showDisconnected();
      }
    }

    async function disconnectWallet() {

      sessionStorage.removeItem(
        "cosmicDreamWallet"
      );

      if (window.ethereum) {

        try {

          await window.ethereum.request({
            method: "wallet_revokePermissions",
            params: [
              {
                eth_accounts: {}
              }
            ]
          });

        } catch (error) {

          console.log(
            "Wallet disconnect error:",
            error
          );

        }
      }

      showDisconnected();
    }

    checkWalletStatus();

  </script>

</body>
</html>
