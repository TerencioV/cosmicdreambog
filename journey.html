<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Cosmic Dream Bog - Journey</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #08090b;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .journey-page {
      position: relative;
      width: 100vw;
      height: 100vh;
    }

    .journey-image {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .disconnect-button {
      position: absolute;
      top: 20px;
      right: 25px;

      padding: 10px 18px;

      border: 1px solid #a855f7;
      border-radius: 8px;

      background: rgba(8, 9, 11, 0.85);
      color: white;

      font-size: 14px;
      font-weight: bold;

      cursor: pointer;
      z-index: 10;
    }

    .disconnect-button:hover {
      background: #7c3aed;
    }
  </style>
</head>

<body>

  <main class="journey-page">

    <img
      src="cdb-journey.png?v=4"
      alt="Cosmic Dream Bog Journey"
      class="journey-image"
    >

    <button
      class="disconnect-button"
      onclick="disconnectWallet()">
      DISCONNECT
    </button>

  </main>

  <script>
    async function disconnectWallet() {

      sessionStorage.removeItem("cosmicDreamWallet");

      if (window.ethereum) {
        try {
          await window.ethereum.request({
            method: "wallet_revokePermissions",
            params: [
              {
                eth_accounts: {}
              }
            ]
          });
        } catch (error) {
          console.log("Wallet permission could not be revoked:", error);
        }
      }

      window.location.href = "index.html?v=4";
    }
  </script>

</body>
</html>
