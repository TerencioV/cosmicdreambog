<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Cosmic Dream Bog - Journey</title>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #08090b;
      overflow: hidden;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .journey-page {
      position: relative;
      width: min(100vw, calc(100vh * 724 / 1086));
      height: min(100vh, calc(100vw * 1086 / 724));
    }

    .journey-image {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
    }

    .bog-voyager-proxy {
      position: absolute;

      top: 2.5%;
      right: 3%;

      width: 18%;
      height: 5%;

      border: none;
      background: transparent;

      cursor: pointer;
      z-index: 10;
    }
  </style>
</head>

<body>

  <main class="journey-page">

    <img
      src="cdb-journey.png"
      alt="Cosmic Dream Bog Journey"
      class="journey-image"
    >

    <button
      class="bog-voyager-proxy"
      aria-label="Bog Voyager - Disconnect Wallet"
      title="Bog Voyager"
      onclick="disconnectWallet()">
    </button>

  </main>

  <script>

    async function disconnectWallet() {

      sessionStorage.removeItem("cosmicDreamWallet");

      if (window.ethereum) {

        try {

          await window.ethereum.request({
            method: "wallet_revokePermissions",
            params: [
              {
                eth_accounts: {}
              }
            ]
          });

        } catch (error) {

          console.log(
            "Wallet permission could not be revoked:",
            error
          );

        }
      }

      window.location.href = "index.html?v=6";
    }

  </script>

</body>
</html>
