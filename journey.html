<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cosmic Dream Bog - Journey</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #08090b;
      overflow: hidden;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .journey-page {
      position: relative;
      width: min(100vw, calc(100vh * 724 / 1086));
      height: min(100vh, calc(100vw * 1086 / 724));
    }

    .journey-image {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
    }

    /* Real BOG VOYAGER button covering the old artwork */
    .bog-voyager {
      position: absolute;
      top: 1.05%;
      right: 1.25%;
      width: 32.5%;
      height: 6.2%;

      padding: 6px 12px;

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;

      border: 1px solid #8b3dff;
      border-radius: 6px;

      background: #08070d;
      color: white;

      box-shadow:
        0 0 0 2px #08090b,
        0 0 8px rgba(139, 61, 255, 0.45);

      cursor: pointer;
      z-index: 100;
    }

    .voyager-text {
      flex: 1;
      min-width: 0;
      text-align: left;
    }

    .voyager-title {
      display: block;
      color: #d8b4fe;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.7px;
      line-height: 1;
    }

    .wallet-address {
      display: block;
      margin-top: 5px;
      color: #d1d5db;
      font-family: monospace;
      font-size: 8px;
      line-height: 1;
      white-space: nowrap;
    }

    .status-dot {
      flex: 0 0 auto;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #ef4444;
      box-shadow: 0 0 7px #ef4444;
    }

    .status-dot.connected {
      background: #22c55e;
      box-shadow: 0 0 7px #22c55e;
    }

    /* Discord icon in Journey footer */
    .discord-link {
      position: absolute;
      right: 2.5%;
      bottom: 1.2%;
      width: 5%;
      height: 4%;
      display: block;
      background: transparent;
      cursor: pointer;
      z-index: 80;
    }
  </style>
</head>

<body>

  <main class="journey-page">

    <img
      src="cdb-journey.png"
      alt="Cosmic Dream Bog Journey"
      class="journey-image"
    >

    <button
      id="bogVoyager"
      class="bog-voyager"
      type="button"
      onclick="toggleWallet()"
      aria-label="Bog Voyager wallet connection">

      <span class="voyager-text">

        <span class="voyager-title">
          BOG VOYAGER
        </span>

        <span
          id="walletAddress"
          class="wallet-address">
          DISCONNECTED
        </span>

      </span>

      <span
        id="statusDot"
        class="status-dot">
      </span>

    </button>

    <a
      class="discord-link"
      href="https://discord.gg/XkxVPNsS6w"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Join Cosmic Dream Bog Discord"
      title="Join Discord">
    </a>

  </main>

  <script>
    const APECHAIN = {
      chainId: "0x8173",
      chainName: "ApeChain",

      nativeCurrency: {
        name: "APE",
        symbol: "APE",
        decimals: 18
      },

      rpcUrls: [
        "https://rpc.apechain.com"
      ],

      blockExplorerUrls: [
        "https://apescan.io/"
      ]
    };

    const walletAddress =
      document.getElementById("walletAddress");

    const statusDot =
      document.getElementById("statusDot");

    function shortenAddress(address) {
      return address.slice(0, 6) + "..." + address.slice(-4);
    }

    function setConnected(address) {
      walletAddress.textContent =
        shortenAddress(address);

      statusDot.classList.add("connected");

      sessionStorage.setItem(
        "cosmicDreamWallet",
        address
      );

      sessionStorage.removeItem(
        "bogVoyagerManualDisconnect"
      );
    }

    function setDisconnected() {
      walletAddress.textContent =
        "DISCONNECTED";

      statusDot.classList.remove("connected");

      sessionStorage.removeItem(
        "cosmicDreamWallet"
      );
    }

    async function ensureApeChain() {
      try {
        await window.ethereum.request({
          method: "wallet_switchEthereumChain",
          params: [{
            chainId: APECHAIN.chainId
          }]
        });

      } catch (switchError) {

        if (switchError.code === 4902) {
          await window.ethereum.request({
            method: "wallet_addEthereumChain",
            params: [APECHAIN]
          });
        } else {
          throw switchError;
        }
      }
    }

    async function checkWalletStatus() {
      if (
        sessionStorage.getItem(
          "bogVoyagerManualDisconnect"
        ) === "true"
      ) {
        setDisconnected();
        return;
      }

      if (!window.ethereum) {
        setDisconnected();
        return;
      }

      try {
        const accounts =
          await window.ethereum.request({
            method: "eth_accounts"
          });

        if (accounts.length > 0) {
          setConnected(accounts[0]);
        } else {
          setDisconnected();
        }

      } catch (error) {
        console.error(error);
        setDisconnected();
      }
    }

    async function connectWallet() {
      if (!window.ethereum) {
        alert("No compatible wallet detected.");
        return;
      }

      try {
        const accounts =
          await window.ethereum.request({
            method: "eth_requestAccounts"
          });

        await ensureApeChain();

        if (accounts.length > 0) {
          setConnected(accounts[0]);
        }

      } catch (error) {
        console.error(error);
      }
    }

    async function disconnectWallet() {
      sessionStorage.setItem(
        "bogVoyagerManualDisconnect",
        "true"
      );

      sessionStorage.removeItem(
        "cosmicDreamWallet"
      );

      if (window.ethereum) {
        try {
          await window.ethereum.request({
            method: "wallet_revokePermissions",
            params: [{
              eth_accounts: {}
            }]
          });

        } catch (error) {
          console.log(
            "Wallet permission revoke:",
            error
          );
        }
      }

      setDisconnected();
    }

    async function toggleWallet() {
      if (
        sessionStorage.getItem(
          "bogVoyagerManualDisconnect"
        ) === "true"
      ) {
        await connectWallet();
        return;
      }

      if (!window.ethereum) {
        setDisconnected();
        return;
      }

      try {
        const accounts =
          await window.ethereum.request({
            method: "eth_accounts"
          });

        if (accounts.length > 0) {
          await disconnectWallet();
        } else {
          await connectWallet();
        }

      } catch (error) {
        console.error(error);
        setDisconnected();
      }
    }

    if (window.ethereum) {
      window.ethereum.on(
        "accountsChanged",
        function(accounts) {

          if (
            sessionStorage.getItem(
              "bogVoyagerManualDisconnect"
            ) === "true"
          ) {
            setDisconnected();
            return;
          }

          if (accounts.length > 0) {
            setConnected(accounts[0]);
          } else {
            setDisconnected();
          }
        }
      );
    }

    checkWalletStatus();
  </script>

</body>
</html>
