<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Cosmic Dream Bog - Journey</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #08090b;
      overflow: hidden;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .journey-page {
      position: relative;
      width: min(100vw, calc(100vh * 724 / 1086));
      height: min(100vh, calc(100vw * 1086 / 724));
    }

    .journey-image {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
    }

    .bog-voyager {
      position: absolute;
      top: 1.6%;
      right: 2.2%;

      width: 27%;
      min-height: 5.2%;

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;

      padding: 6px 10px;

      border: 1px solid rgba(168, 85, 247, 0.75);
      border-radius: 6px;

      background: rgba(12, 8, 20, 0.97);
      color: white;

      cursor: pointer;
      z-index: 50;
    }

    .voyager-info {
      min-width: 0;
      text-align: left;
    }

    .voyager-title {
      display: block;
      color: #d8b4fe;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.5px;
      line-height: 1.1;
    }

    .voyager-address {
      display: block;
      margin-top: 3px;

      color: #d1d5db;
      font-family: monospace;
      font-size: 8px;
      white-space: nowrap;
    }

    .status-dot {
      flex: 0 0 auto;

      width: 9px;
      height: 9px;

      border-radius: 50%;

      background: #22c55e;
      box-shadow: 0 0 8px #22c55e;
    }

    .status-dot.disconnected {
      background: #ef4444;
      box-shadow: 0 0 8px #ef4444;
    }
  </style>
</head>

<body>

  <main class="journey-page">

    <img
      src="cdb-journey.png?v=9"
      alt="Cosmic Dream Bog Journey"
      class="journey-image"
    >

    <button
      id="bogVoyager"
      class="bog-voyager"
      type="button"
      onclick="toggleWallet()"
    >

      <span class="voyager-info">

        <span class="voyager-title">
          BOG VOYAGER
        </span>

        <span
          id="walletAddress"
          class="voyager-address">
          DISCONNECTED
        </span>

      </span>

      <span
        id="statusDot"
        class="status-dot disconnected">
      </span>

    </button>

  </main>

  <script>

    const walletAddress =
      document.getElementById("walletAddress");

    const statusDot =
      document.getElementById("statusDot");

    function shortenAddress(address) {
      return (
        address.slice(0, 6) +
        "..." +
        address.slice(-4)
      );
    }

    function showConnected(address) {

      walletAddress.textContent =
        shortenAddress(address);

      statusDot.classList.remove(
        "disconnected"
      );

      sessionStorage.setItem(
        "cosmicDreamWallet",
        address
      );
    }

    function showDisconnected() {

      walletAddress.textContent =
        "DISCONNECTED";

      statusDot.classList.add(
        "disconnected"
      );

      sessionStorage.removeItem(
        "cosmicDreamWallet"
      );
    }

    async function checkWallet() {

      if (!window.ethereum) {
        showDisconnected();
        return;
      }

      try {

        const accounts =
          await window.ethereum.request({
            method: "eth_accounts"
          });

        if (accounts.length > 0) {

          showConnected(accounts[0]);

        } else {

          showDisconnected();

        }

      } catch (error) {

        console.error(error);
        showDisconnected();

      }
    }

    async function connectWallet() {

      if (!window.ethereum) {

        alert(
          "No compatible wallet detected."
        );

        return;
      }

      try {

        const accounts =
          await window.ethereum.request({
            method: "eth_requestAccounts"
          });

        if (accounts.length > 0) {

          showConnected(accounts[0]);

        }

      } catch (error) {

        console.error(error);

      }
    }

    async function disconnectWallet() {

      if (window.ethereum) {

        try {

          await window.ethereum.request({
            method: "wallet_revokePermissions",
            params: [
              {
                eth_accounts: {}
              }
            ]
          });

        } catch (error) {

          console.log(
            "Wallet permission revoke:",
            error
          );

        }
      }

      showDisconnected();
    }

    async function toggleWallet() {

      if (!window.ethereum) {
        showDisconnected();
        return;
      }

      try {

        const accounts =
          await window.ethereum.request({
            method: "eth_accounts"
          });

        if (accounts.length > 0) {

          await disconnectWallet();

        } else {

          await connectWallet();

        }

      } catch (error) {

        console.error(error);
        showDisconnected();

      }
    }

    if (window.ethereum) {

      window.ethereum.on(
        "accountsChanged",
        function(accounts) {

          if (accounts.length > 0) {

            showConnected(accounts[0]);

          } else {

            showDisconnected();

          }

        }
      );
    }

    checkWallet();

  </script>

</body>
</html>
