<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cosmic Dream Bog - Journey</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #08090b;
    }

    body::before {
      content: "";
      position: fixed;
      inset: -30px;
      background-image: url('cdb-journey.png');
      background-size: cover;
      background-position: center;
      filter: blur(25px) brightness(0.35);
      transform: scale(1.08);
      z-index: 0;
    }

    .journey-page {
      position: relative;
      z-index: 1;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .journey-page img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }
  </style>
</head>

<body>

  <main class="journey-page">
    <img
      src="cdb-journey.png"
      alt="Cosmic Dream Bog Journey"
    >
  </main>

</body>
</html>
