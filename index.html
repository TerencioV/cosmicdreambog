<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Cosmic Dream Bog</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* =========================================
       MAIN 16:9 STAGE
       ========================================= */

    .stage {
      position: relative;

      width: min(
        100vw,
        calc(100svh * 16 / 9)
      );

      height: min(
        100svh,
        calc(100vw * 9 / 16)
      );

      background: #000;
      overflow: hidden;
    }

    .homepage-image {
      position: absolute;
      inset: 0;

      width: 100%;
      height: 100%;

      object-fit: fill;

      display: block;

      pointer-events: none;
      user-select: none;
    }

    /* =========================================
       INVISIBLE REAL BUTTONS
       ========================================= */

    .hotspot {
      position: absolute;

      border: 1px solid transparent;
      border-radius: 10px;

      background: transparent;

      cursor: pointer;

      z-index: 20;

      transition:
        box-shadow 0.15s ease,
        transform 0.12s ease,
        border-color 0.15s ease;
    }

    .hotspot:hover {
      border-color: rgba(194, 104, 255, 0.65);

      box-shadow:
        0 0 8px rgba(156, 55, 255, 0.7),
        0 0 18px rgba(156, 55, 255, 0.45);

      transform: translateY(-2px);
    }

    .hotspot:active {
      transform: translateY(2px) scale(0.98);
    }

    /* Alliance button */
    .alliance-hotspot {
      top: 3%;
      right: 5.3%;

      width: 13.5%;
      height: 8%;
    }

    /* Connect Wallet */
    .wallet-hotspot {
      left: 31.5%;
      bottom: 13.3%;

      width: 32.8%;
      height: 10.2%;
    }

    /* X */
    .x-hotspot {
      left: 39%;
      bottom: 3.7%;

      width: 6.2%;
      height: 5.8%;
    }

    /* Discord */
    .discord-hotspot {
      left: 47.8%;
      bottom: 3.7%;

      width: 12.2%;
      height: 5.8%;
    }

    /* =========================================
       ALLIANCE MODAL
       ========================================= */

    .modal-overlay {
      position: fixed;
      inset: 0;

      display: none;

      justify-content: center;
      align-items: center;

      padding: 20px;

      background: rgba(0, 0, 0, 0.82);

      backdrop-filter: blur(7px);

      z-index: 1000;
    }

    .modal-overlay.open {
      display: flex;
    }

    .modal {
      width: min(92vw, 420px);

      padding: 28px;

      border:
        1px solid rgba(170, 255, 20, 0.55);

      border-radius: 12px;

      background:
        linear-gradient(
          145deg,
          #0b0a11,
          #050507
        );

      color: white;

      text-align: center;

      box-shadow:
        0 0 35px rgba(135, 0, 255, 0.35);
    }

    .modal h2 {
      margin: 0 0 10px;

      color: #b9e629;

      letter-spacing: 1px;
    }

    .modal p {
      color: #bdb7c7;

      font-size: 14px;
      line-height: 1.5;

      margin-bottom: 20px;
    }

    .password-input {
      width: 100%;

      padding: 14px;

      border:
        1px solid rgba(255,255,255,0.2);

      border-radius: 7px;

      background: #09090d;
      color: white;

      outline: none;

      font-size: 16px;
    }

    .password-input:focus {
      border-color: #b9e629;
    }

    .enter-button {
      width: 100%;

      margin-top: 12px;

      padding: 14px;

      border: 1px solid #b9e629;
      border-radius: 7px;

      background:
        linear-gradient(
          180deg,
          #a1cf21,
          #597b10
        );

      color: #071004;

      font-size: 14px;
      font-weight: 900;

      letter-spacing: 1px;

      cursor: pointer;
    }

    .enter-button:hover {
      filter: brightness(1.12);
    }

    .gate-message {
      min-height: 18px;

      margin-top: 12px;

      color: #ff7272;

      font-size: 12px;
    }

    .close-button {
      margin-top: 5px;

      border: 0;
      background: transparent;

      color: #aaa;

      cursor: pointer;
    }

    /* =========================================
       MOBILE / SMALL SCREEN
       ========================================= */

    @media (max-width: 700px) {

      .stage {
        width: 100vw;
        height: calc(100vw * 9 / 16);
      }

      .wallet-hotspot {
        left: 30%;
        width: 40%;

        bottom: 11.5%;
        height: 14%;
      }

      .x-hotspot {
        left: 37%;
        bottom: 1.7%;

        width: 11%;
        height: 10%;
      }

      .discord-hotspot {
        left: 49%;
        bottom: 1.7%;

        width: 18%;
        height: 10%;
      }

      .alliance-hotspot {
        top: 1.5%;
        right: 4%;

        width: 19%;
        height: 12%;
      }
    }
  </style>
</head>

<body>

  <main class="stage">

    <img
      src="cdb-homepage-desktop.png"
      alt="Cosmic Dream Bog"
      class="homepage-image"
    >

    <button
      class="hotspot alliance-hotspot"
      type="button"
      aria-label="Alliance Access"
      onclick="openAllianceGate()">
    </button>

    <button
      class="hotspot wallet-hotspot"
      type="button"
      aria-label="Connect Wallet"
      onclick="connectWallet()">
    </button>

    <a
      class="hotspot x-hotspot"
      href="https://x.com/bogvoyager"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Bog Voyager on X">
    </a>

    <a
      class="hotspot discord-hotspot"
      href="https://discord.gg/XkxVPNsS6w"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Cosmic Dream Bog Discord">
    </a>

  </main>


  <!-- ======================================
       ALLIANCE ACCESS
       ====================================== -->

  <div
    id="allianceModal"
    class="modal-overlay">

    <div class="modal">

      <h2>
        ALLIANCE ACCESS
      </h2>

      <p>
        This briefing is reserved for invited project allies.
      </p>

      <input
        id="alliancePassword"
        class="password-input"
        type="password"
        placeholder="Enter access code"
        autocomplete="off"
      >

      <button
        class="enter-button"
        onclick="checkAlliancePassword()">
        ENTER THE BOG
      </button>

      <div
        id="gateMessage"
        class="gate-message">
      </div>

      <button
        class="close-button"
        onclick="closeAllianceGate()">
        Cancel
      </button>

    </div>

  </div>


  <script>

    /* ======================================
       APECHAIN
       ====================================== */

    const APECHAIN = {

      chainId: "0x8173",

      chainName: "ApeChain",

      nativeCurrency: {
        name: "APE",
        symbol: "APE",
        decimals: 18
      },

      rpcUrls: [
        "https://apechain.calderachain.xyz/http"
      ],

      blockExplorerUrls: [
        "https://apescan.io/"
      ]
    };


    /* ======================================
       CONNECT REAL BROWSER WALLET
       ====================================== */

    async function connectWallet() {

      if (!window.ethereum) {

        alert(
          "No compatible browser wallet was detected."
        );

        return;
      }

      try {

        const accounts =
          await window.ethereum.request({
            method: "eth_requestAccounts"
          });

        try {

          await window.ethereum.request({

            method:
              "wallet_switchEthereumChain",

            params: [
              {
                chainId:
                  APECHAIN.chainId
              }
            ]
          });

        }

        catch (switchError) {

          if (switchError.code === 4902) {

            await window.ethereum.request({

              method:
                "wallet_addEthereumChain",

              params: [
                APECHAIN
              ]
            });

          }

          else {

            throw switchError;
          }
        }


        if (accounts.length > 0) {

          sessionStorage.setItem(
            "cosmicDreamWallet",
            accounts[0]
          );

          sessionStorage.removeItem(
            "bogVoyagerManualDisconnect"
          );

          window.location.href =
            "journey.html";
        }

      }

      catch (error) {

        console.error(error);

        if (error.code === 4001) {

          alert(
            "Wallet connection was cancelled."
          );

        }

        else {

          alert(
            "Wallet connection failed. Please try again."
          );
        }
      }
    }


    /* ======================================
       ALLIANCE GATE
       ====================================== */

    const ALLIANCE_HASH =
      "afe3c1947d3b3a6e5e04159d81d9ceba8ab63094c8f67abf717ad752f86bd4f6";


    function openAllianceGate() {

      document
        .getElementById(
          "allianceModal"
        )
        .classList
        .add("open");

      document
        .getElementById(
          "gateMessage"
        )
        .textContent = "";

      document
        .getElementById(
          "alliancePassword"
        )
        .value = "";

      setTimeout(() => {

        document
          .getElementById(
            "alliancePassword"
          )
          .focus();

      }, 100);
    }


    function closeAllianceGate() {

      document
        .getElementById(
          "allianceModal"
        )
        .classList
        .remove("open");
    }


    async function hashPassword(value) {

      const encoded =
        new TextEncoder()
        .encode(value);

      const hash =
        await crypto.subtle.digest(
          "SHA-256",
          encoded
        );

      return Array
        .from(
          new Uint8Array(hash)
        )
        .map(
          byte =>
            byte
              .toString(16)
              .padStart(2, "0")
        )
        .join("");
    }


    async function checkAlliancePassword() {

      const input =
        document
          .getElementById(
            "alliancePassword"
          );

      const message =
        document
          .getElementById(
            "gateMessage"
          );

      const entered =
        input.value.trim();

      if (!entered) {

        message.textContent =
          "Enter the access code.";

        return;
      }


      const enteredHash =
        await hashPassword(
          entered
        );


      if (
        enteredHash ===
        ALLIANCE_HASH
      ) {

        sessionStorage.setItem(
          "allianceAccess",
          "granted"
        );

        window.location.href =
          "alliance.html";

      }

      else {

        message.textContent =
          "Access denied.";

        input.value = "";
        input.focus();
      }
    }


    /* Enter key submits password */

    document
      .getElementById(
        "alliancePassword"
      )
      .addEventListener(
        "keydown",
        function(event) {

          if (
            event.key === "Enter"
          ) {

            checkAlliancePassword();
          }
        }
      );


    /* Clicking dark area closes gate */

    document
      .getElementById(
        "allianceModal"
      )
      .addEventListener(
        "click",
        function(event) {

          if (
            event.target === this
          ) {

            closeAllianceGate();
          }
        }
      );

  </script>

</body>
</html>
