<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cosmic Dream Bog</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #08090b;
      overflow: hidden;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .homepage {
      position: relative;
      width: min(100vw, calc(100vh * 16 / 9));
      height: min(100vh, calc(100vw * 9 / 16));
    }

    .homepage img {
      width: 100%;
      height: 100%;
      display: block;
    }

    .wallet-button {
      position: absolute;
      left: 34%;
      top: 76%;
      width: 32%;
      height: 9%;
      border: none;
      background: transparent;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <div class="homepage">

    <img
      src="cdb-homepage-desktop.png"
      alt="Cosmic Dream Bog"
    >

    <button
      class="wallet-button"
      aria-label="Connect Wallet"
      onclick="connectWallet()">
    </button>

  </div>

  <script>
    function connectWallet() {
      alert("Wallet connection coming soon.");
    }
  </script>

</body>
</html>
