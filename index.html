<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cosmic Dream Bog</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #08090b;
      overflow: hidden;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .homepage {
      position: relative;
      width: min(100vw, calc(100vh * 16 / 9));
      height: min(100vh, calc(100vw * 9 / 16));
    }

    .homepage-image {
      width: 100%;
      height: 100%;
      display: block;
    }

    .wallet-button {
      position: absolute;
      left: 34%;
      top: 76%;
      width: 32%;
      height: 9%;
      border: 0;
      background: transparent;
      cursor: pointer;
      z-index: 20;
    }

    .discord-link {
      position: absolute;
      left: 64.5%;
      top: 95%;
      width: 3.5%;
      height: 4%;
      display: block;
      background: transparent;
      cursor: pointer;
      z-index: 30;
    }
  </style>
</head>

<body>

  <main class="homepage">

    <img
      src="cdb-homepage-desktop.png"
      alt="Cosmic Dream Bog"
      class="homepage-image"
    >

    <button
      class="wallet-button"
      type="button"
      aria-label="Connect Wallet"
      onclick="connectWallet()">
    </button>

    <a
      class="discord-link"
      href="https://discord.gg/XkxVPNsS6w"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Join Cosmic Dream Bog Discord"
      title="Join Discord">
    </a>

  </main>

  <script>
    const APECHAIN = {
      chainId: "0x8173",
      chainName: "ApeChain",

      nativeCurrency: {
        name: "APE",
        symbol: "APE",
        decimals: 18
      },

      rpcUrls: [
        "https://rpc.apechain.com"
      ],

      blockExplorerUrls: [
        "https://apescan.io/"
      ]
    };

    async function ensureApeChain() {
      try {
        await window.ethereum.request({
          method: "wallet_switchEthereumChain",
          params: [{
            chainId: APECHAIN.chainId
          }]
        });
      } catch (switchError) {
        if (switchError.code === 4902) {
          await window.ethereum.request({
            method: "wallet_addEthereumChain",
            params: [APECHAIN]
          });
        } else {
          throw switchError;
        }
      }
    }

    async function connectWallet() {
      if (!window.ethereum) {
        alert("No compatible wallet detected. Please install or open MetaMask.");
        return;
      }

      try {
        const accounts = await window.ethereum.request({
          method: "eth_requestAccounts"
        });

        await ensureApeChain();

        if (accounts.length > 0) {
          sessionStorage.setItem(
            "cosmicDreamWallet",
            accounts[0]
          );

          sessionStorage.removeItem(
            "bogVoyagerManualDisconnect"
          );

          window.location.href = "journey.html";
        }

      } catch (error) {
        console.error(error);

        if (error.code === 4001) {
          alert("Wallet connection was cancelled.");
        } else {
          alert("Wallet connection failed. Please try again.");
        }
      }
    }
  </script>

</body>
</html>
