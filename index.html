<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cosmic Dream Bog</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #08090b;
      overflow: hidden;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .homepage {
      position: relative;
      width: 100vw;
      height: 100vh;
    }

    .homepage img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .wallet-button {
      position: absolute;
      left: 34%;
      top: 76%;
      width: 32%;
      height: 9%;
      border: none;
      background: transparent;
      cursor: pointer;
      z-index: 10;
    }
  </style>
</head>

<body>

  <div class="homepage">

    <img
      src="cdb-homepage-desktop.png"
      alt="Cosmic Dream Bog"
    >

    <button
      class="wallet-button"
      aria-label="Connect Wallet"
      onclick="connectWallet()">
    </button>

  </div>

  <script>
    const APECHAIN = {
      chainId: "0x8173",
      chainName: "ApeChain",
      nativeCurrency: {
        name: "APE",
        symbol: "APE",
        decimals: 18
      },
      rpcUrls: [
        "https://rpc.apechain.com/http"
      ],
      blockExplorerUrls: [
        "https://apescan.io/"
      ]
    };

    async function connectWallet() {

      if (typeof window.ethereum === "undefined") {
        alert(
          "No compatible browser wallet was detected. Please install or open MetaMask and try again."
        );
        return;
      }

      try {

        const accounts = await window.ethereum.request({
          method: "eth_requestAccounts"
        });

        try {

          await window.ethereum.request({
            method: "wallet_switchEthereumChain",
            params: [
              {
                chainId: APECHAIN.chainId
              }
            ]
          });

        } catch (switchError) {

          if (switchError.code === 4902) {

            await window.ethereum.request({
              method: "wallet_addEthereumChain",
              params: [APECHAIN]
            });

          } else {
            throw switchError;
          }
        }

        const address = accounts[0];

        const shortAddress =
          address.slice(0, 6) +
          "..." +
          address.slice(-4);

        alert(
          "Wallet connected to ApeChain: " +
          shortAddress
        );

      } catch (error) {

        console.error(error);

        if (error.code === 4001) {
          alert("Wallet connection was cancelled.");
        } else {
          alert("Wallet connection failed. Please try again.");
        }

      }
    }
  </script>

</body>
</html>
