<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cosmic Dream Bog</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #000;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    .page {
      position: relative;
      width: min(100vw, 1600px);
      aspect-ratio: 16 / 9;
      background: url('cdb-homepage-desktop.png') center center / contain no-repeat;
      background-color: #000;
    }

    .hotspot {
      position: absolute;
      background: transparent;
      border: none;
      cursor: pointer;
      z-index: 5;
    }

    .hotspot:hover {
      box-shadow: 0 0 0 2px rgba(162, 84, 255, 0.55);
      border-radius: 12px;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0,0,0,0);
      border: 0;
    }

    /* Desktop positions based on your current artwork */
    .alliance-btn {
      top: 3%;
      right: 5.3%;
      width: 13.5%;
      height: 8%;
      border-radius: 8px;
    }

    .wallet-btn {
      left: 31.5%;
      bottom: 13.3%;
      width: 32.8%;
      height: 10.2%;
      border-radius: 14px;
    }

    .x-btn {
      left: 39%;
      bottom: 3.7%;
      width: 6.2%;
      height: 5.8%;
      border-radius: 10px;
    }

    .discord-btn {
      left: 47.8%;
      bottom: 3.7%;
      width: 12.2%;
      height: 5.8%;
      border-radius: 10px;
    }

    /* Mobile adjustments */
    @media (max-width: 900px) {
      .page {
        width: 100vw;
        height: 100vh;
        aspect-ratio: auto;
        background-size: contain;
      }

      .alliance-btn {
        top: 4%;
        right: 5%;
        width: 24%;
        height: 6%;
      }

      .wallet-btn {
        left: 19%;
        bottom: 18%;
        width: 62%;
        height: 8%;
      }

      .x-btn {
        left: 34%;
        bottom: 8%;
        width: 10%;
        height: 4.5%;
      }

      .discord-btn {
        left: 47%;
        bottom: 8%;
        width: 18%;
        height: 4.5%;
      }
    }
  </style>
</head>
<body>
  <div class="page">

    <button class="hotspot alliance-btn" onclick="allianceAccess()">
      <span class="sr-only">Alliance Access</span>
    </button>

    <button class="hotspot wallet-btn" onclick="connectWallet()">
      <span class="sr-only">Connect Wallet</span>
    </button>

    <button class="hotspot x-btn" onclick="window.open('https://x.com/bogvoyager', '_blank')">
      <span class="sr-only">X</span>
    </button>

    <button class="hotspot discord-btn" onclick="window.open('https://discord.gg/XkxVPNsS6w', '_blank')">
      <span class="sr-only">Discord</span>
    </button>

  </div>

  <script>
    function connectWallet() {
      localStorage.setItem('bogWalletConnected', 'true');
      window.location.href = 'journey.html?v=11';
    }

    function allianceAccess() {
      const password = prompt('Enter Alliance Password');
      if (password === 'Alliance') {
        window.location.href = 'alliance.html';
      } else if (password !== null) {
        alert('Incorrect password');
      }
    }
  </script>
</body>
</html>
