<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Cosmic Dream Bog</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Exact aspect ratio of the current homepage PNG */
    .stage {
      position: relative;

      width: min(
        100vw,
        calc(100svh * 1672 / 941)
      );

      height: min(
        100svh,
        calc(100vw * 941 / 1672)
      );

      background: #000;
      overflow: hidden;
    }

    .homepage-image {
      position: absolute;
      inset: 0;

      width: 100%;
      height: 100%;

      display: block;
      object-fit: contain;

      pointer-events: none;
      user-select: none;
    }

    /* Clickable overlays */
    .hotspot {
      position: absolute;

      background: transparent;
      border: 1px solid transparent;
      border-radius: 8px;

      cursor: pointer;

      z-index: 20;

      transition:
        border-color 0.15s ease,
        box-shadow 0.15s ease,
        transform 0.12s ease;
    }

    .hotspot:hover {
      border-color: rgba(188, 91, 255, 0.9);

      box-shadow:
        0 0 8px rgba(165, 56, 255, 0.8),
        0 0 18px rgba(165, 56, 255, 0.45);

      transform: translateY(-1px);
    }

    .hotspot:active {
      transform: translateY(2px) scale(0.985);
    }

    /* Exact locations measured from the PNG */

    .alliance-hotspot {
      left: 81.94%;
      top: 5.21%;

      width: 15.01%;
      height: 6.38%;
    }

    .wallet-hotspot {
      left: 33.37%;
      top: 74.50%;

      width: 33.19%;
      height: 12.11%;

      border-radius: 16px;
    }

    .x-hotspot {
      left: 39.05%;
      top: 89.27%;

      width: 8.85%;
      height: 7.01%;
    }

    .discord-hotspot {
      left: 51.02%;
      top: 89.16%;

      width: 9.93%;
      height: 7.12%;
    }

    /* Discreet legal links */
    .legal-links {
      position: fixed;
      right: 14px;
      bottom: 10px;

      display: flex;
      align-items: center;
      gap: 7px;

      z-index: 100;

      font-size: 10px;
      letter-spacing: 0.3px;

      color: rgba(255, 255, 255, 0.42);
    }

    .legal-links a {
      color: inherit;
      text-decoration: none;

      transition: color 0.15s ease;
    }

    .legal-links a:hover {
      color: rgba(255, 255, 255, 0.8);
    }

    .legal-divider {
      opacity: 0.45;
    }

    /* Alliance modal */

    .modal-overlay {
      position: fixed;
      inset: 0;

      display: none;
      align-items: center;
      justify-content: center;

      padding: 20px;

      background: rgba(0, 0, 0, 0.84);
      backdrop-filter: blur(7px);

      z-index: 1000;
    }

    .modal-overlay.open {
      display: flex;
    }

    .modal {
      width: min(92vw, 420px);

      padding: 28px;

      border: 1px solid rgba(185, 230, 41, 0.6);
      border-radius: 12px;

      background:
        linear-gradient(
          145deg,
          #0c0913,
          #050507
        );

      color: #fff;
      text-align: center;

      box-shadow:
        0 0 40px rgba(118, 35, 180, 0.35);
    }

    .modal h2 {
      margin: 0 0 10px;

      color: #b9e629;

      letter-spacing: 1px;
    }

    .modal p {
      margin: 0 0 20px;

      color: #bbb5c4;

      font-size: 14px;
      line-height: 1.5;
    }

    .password-input {
      width: 100%;

      padding: 14px;

      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 7px;

      background: #09090d;
      color: #fff;

      outline: none;

      font-size: 16px;
    }

    .password-input:focus {
      border-color: #b9e629;
    }

    .enter-button {
      width: 100%;

      margin-top: 12px;
      padding: 14px;

      border: 1px solid #b9e629;
      border-radius: 7px;

      background:
        linear-gradient(
          180deg,
          #a6d227,
          #5c7d13
        );

      color: #071004;

      font-weight: 900;
      letter-spacing: 1px;

      cursor: pointer;
    }

    .enter-button:hover {
      filter: brightness(1.12);
    }

    .gate-message {
      min-height: 18px;

      margin-top: 12px;

      color: #ff7373;

      font-size: 12px;
    }

    .close-button {
      margin-top: 5px;

      border: 0;
      background: transparent;

      color: #aaa;

      cursor: pointer;
    }
  </style>
</head>

<body>

  <main class="stage">

    <img
      src="cdb-homepage-desktop.png"
      alt="Cosmic Dream Bog"
      class="homepage-image"
    >

    <button
      class="hotspot alliance-hotspot"
      type="button"
      aria-label="Alliance Access"
      onclick="openAllianceGate()">
    </button>

    <button
      class="hotspot wallet-hotspot"
      type="button"
      aria-label="Connect Wallet"
      onclick="connectWallet()">
    </button>

    <a
      class="hotspot x-hotspot"
      href="https://x.com/bogvoyager"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Bog Voyager on X">
    </a>

    <a
      class="hotspot discord-hotspot"
      href="https://discord.gg/XkxVPNsS6w"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Cosmic Dream Bog Discord">
    </a>

  </main>


  <!-- Small legal links in the bottom-right corner -->
  <div class="legal-links">
    <a href="terms.html">Terms</a>
    <span class="legal-divider">·</span>
    <a href="privacy.html">Privacy</a>
  </div>


  <div
    id="allianceModal"
    class="modal-overlay">

    <div class="modal">

      <h2>
        ALLIANCE ACCESS
      </h2>

      <p>
        This briefing is reserved for invited project allies.
      </p>

      <input
        id="alliancePassword"
        class="password-input"
        type="password"
        placeholder="Enter access code"
        autocomplete="off"
      >

      <button
        class="enter-button"
        type="button"
        onclick="checkAlliancePassword()">
        ENTER THE BOG
      </button>

      <div
        id="gateMessage"
        class="gate-message">
      </div>

      <button
        class="close-button"
        type="button"
        onclick="closeAllianceGate()">
        Cancel
      </button>

    </div>

  </div>


  <script>

    const APECHAIN = {
      chainId: "0x8173",

      chainName: "ApeChain",

      nativeCurrency: {
        name: "APE",
        symbol: "APE",
        decimals: 18
      },

      rpcUrls: [
        "https://apechain.calderachain.xyz/http"
      ],

      blockExplorerUrls: [
        "https://apescan.io/"
      ]
    };


    async function connectWallet() {

      if (!window.ethereum) {

        alert(
          "No compatible browser wallet was detected."
        );

        return;
      }


      try {

        const accounts =
          await window.ethereum.request({
            method: "eth_requestAccounts"
          });


        try {

          await window.ethereum.request({

            method:
              "wallet_switchEthereumChain",

            params: [
              {
                chainId:
                  APECHAIN.chainId
              }
            ]
          });

        }

        catch (switchError) {

          if (switchError.code === 4902) {

            await window.ethereum.request({

              method:
                "wallet_addEthereumChain",

              params: [
                APECHAIN
              ]
            });

          }

          else {

            throw switchError;
          }
        }


        if (accounts.length > 0) {

          sessionStorage.setItem(
            "cosmicDreamWallet",
            accounts[0]
          );

          sessionStorage.removeItem(
            "bogVoyagerManualDisconnect"
          );

          window.location.href =
            "journey.html";
        }

      }

      catch (error) {

        console.error(error);

        if (error.code === 4001) {

          alert(
            "Wallet connection was cancelled."
          );

        }

        else {

          alert(
            "Wallet connection failed. Please try again."
          );
        }
      }
    }


    const ALLIANCE_HASH =
      "afe3c1947d3b3a6e5e04159d81d9ceba8ab63094c8f67abf717ad752f86bd4f6";


    function openAllianceGate() {

      const modal =
        document.getElementById(
          "allianceModal"
        );

      const input =
        document.getElementById(
          "alliancePassword"
        );

      const message =
        document.getElementById(
          "gateMessage"
        );

      message.textContent = "";
      input.value = "";

      modal.classList.add(
        "open"
      );

      setTimeout(() => {
        input.focus();
      }, 100);
    }


    function closeAllianceGate() {

      document
        .getElementById(
          "allianceModal"
        )
        .classList
        .remove("open");
    }


    async function hashPassword(value) {

      const encoded =
        new TextEncoder()
        .encode(value);

      const hash =
        await crypto.subtle.digest(
          "SHA-256",
          encoded
        );

      return Array
        .from(
          new Uint8Array(hash)
        )
        .map(
          byte =>
            byte
              .toString(16)
              .padStart(2, "0")
        )
        .join("");
    }


    async function checkAlliancePassword() {

      const input =
        document.getElementById(
          "alliancePassword"
        );

      const message =
        document.getElementById(
          "gateMessage"
        );

      const entered =
        input.value.trim();


      if (!entered) {

        message.textContent =
          "Enter the access code.";

        return;
      }


      const enteredHash =
        await hashPassword(
          entered
        );


      if (
        enteredHash ===
        ALLIANCE_HASH
      ) {

        sessionStorage.setItem(
          "allianceAccess",
          "granted"
        );

        window.location.href =
          "alliance.html";

      }

      else {

        message.textContent =
          "Access denied.";

        input.value = "";
        input.focus();
      }
    }


    document
      .getElementById(
        "alliancePassword"
      )
      .addEventListener(
        "keydown",
        function(event) {

          if (
            event.key === "Enter"
          ) {

            checkAlliancePassword();
          }
        }
      );


    document
      .getElementById(
        "allianceModal"
      )
      .addEventListener(
        "click",
        function(event) {

          if (
            event.target === this
          ) {

            closeAllianceGate();
          }
        }
      );

  </script>

</body>
</html>
